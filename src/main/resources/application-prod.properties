# APPLICATION
spring.application.name=invoiceManagementSystem
server.port=8083
server.servlet.context-path=/api/v1.0

# DATABASE
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# JWT
jwt.secret.key=${JWT_SECRET}

# EMAIL
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# FILE UPLOADS
file.upload-dir=/opt/ims/uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# APPLICATION URL
app.base-url=https://ims.zenfuture.in/api/v1.0

# WEBSOCKET
app.websocket.allowed-origins=https://ims.zenfuture.in

# LOGGING
logging.level.root=INFO
logging.level.com.ims=INFO


#CURRENCY
app.currency.default-code=INR
